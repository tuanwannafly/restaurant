# KHÔNG commit file này lên Git với giá trị thật!
# Dùng Sealed Secrets hoặc External Secrets Operator trong production.
#
# Tạo secret thực tế bằng lệnh:
#   kubectl create secret generic smart-restaurant-secret \
#     --from-literal=DB_URL='jdbc:oracle:thin:@host:1521/SERVICE' \
#     --from-literal=DB_USERNAME='your_user' \
#     --from-literal=DB_PASSWORD='your_pass' \
#     --from-literal=MAIL_USERNAME='your@gmail.com' \
#     --from-literal=MAIL_PASSWORD='app_password' \
#     --from-literal=VNC_PASSWORD='' \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: smart-restaurant-secret
  labels:
    app: smart-restaurant
type: Opaque
stringData:
  DB_URL:        "jdbc:oracle:thin:@REPLACE_HOST:1521/REPLACE_SERVICE"
  DB_USERNAME:   "REPLACE_USER"
  DB_PASSWORD:   "REPLACE_PASS"
  MAIL_USERNAME: "REPLACE_EMAIL"
  MAIL_PASSWORD: "REPLACE_APP_PASS"
  VNC_PASSWORD:  ""
