apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-restaurant-hpa
  labels:
    app: smart-restaurant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-restaurant

  minReplicas: 2     # Luôn có ít nhất 2 pod (HA)
  maxReplicas: 10    # Tối đa 10 pod khi cao điểm

  metrics:
    # Scale khi CPU > 70%
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # Scale khi RAM > 80%
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # Đợi 60s trước khi scale up thêm
      policies:
        - type: Pods
          value: 2                       # Tăng tối đa 2 pod mỗi lần
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Đợi 5 phút trước khi scale down (tránh flapping)
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
