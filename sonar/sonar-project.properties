# sonar-project.properties
# Dùng khi chạy sonar-scanner CLI hoặc Maven plugin
# Tài liệu: https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=smart-restaurant
sonar.projectName=SmartRestaurant
sonar.projectVersion=1.0.0

# ── Source ────────────────────────────────────────────────────────────
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# ── Coverage (JaCoCo) ─────────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# ── Encoding ──────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Quality Gate cho Banking/Security (nghiêm ngặt hơn default) ───────
# Các rule quan trọng với ngân hàng:
#   java:S2077  - SQL Injection
#   java:S2076  - OS command injection
#   java:S5344  - Password không hash
#   java:S5542  - Weak crypto
#   java:S5659  - JWT không verify signature
sonar.java.source=17

# ── Exclusions (không scan file generate / vendor) ────────────────────
sonar.exclusions=**/module-info.java,target/**,**/*.xml

# ── Duplicate code threshold ──────────────────────────────────────────
sonar.cpd.java.minimumTokens=50
