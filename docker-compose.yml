services:

  # ────────────────────────────────────────────────────────────────
  # postgres — PostgreSQL 16  (thay Oracle)
  # ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: smartrestaurant-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB:       smartrestaurant
      POSTGRES_USER:     restaurant
      POSTGRES_PASSWORD: restaurant123

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Bỏ comment sau khi tạo init.sql:
      # - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d smartrestaurant"]
      interval:    10s
      timeout:      5s
      retries:       5
      start_period: 15s

    ports:
      - "5432:5432"   # mở ra host để debug bằng DBeaver/pgAdmin

  # ────────────────────────────────────────────────────────────────
  # redis — Redis 7 Alpine  (~10 MB image, rất nhẹ)
  # ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartrestaurant-redis
    restart: unless-stopped

    command: redis-server --save 60 1 --loglevel warning

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval:    10s
      timeout:      3s
      retries:      3
      start_period: 5s

    ports:
      - "6379:6379"   # mở ra host để debug bằng redis-cli

  # ────────────────────────────────────────────────────────────────
  # app — SmartRestaurant  (build từ Dockerfile)
  # ────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-restaurant:latest
    container_name: smartrestaurant-app
    restart: unless-stopped

    environment:
      # ── Database: DBConnection.java đọc các env vars này ──────
      DB_URL:      jdbc:postgresql://postgres:5432/smartrestaurant
      #              ↑ "postgres" là tên service, Docker tự resolve DNS nội bộ
      DB_USERNAME: restaurant
      DB_PASSWORD: restaurant123
      DB_DRIVER:   org.postgresql.Driver

      # ── HikariCP pool ─────────────────────────────────────────
      DB_POOL_MAX:     "10"
      DB_POOL_MIN:     "2"
      DB_POOL_TIMEOUT: "30000"

      # ── Redis: KitchenLockService + OrderLockService ──────────
      REDIS_HOST: redis
      REDIS_PORT: "6379"

      # ── Java encoding ─────────────────────────────────────────
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

    ports:
      - "8025:8025"   # WebSocket server
      - "5900:5900"

    depends_on:
      postgres:
        condition: service_healthy   # chờ pg_isready OK trước khi start app
      redis:
        condition: service_started

    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
  redis_data:
  app_logs: