# ============================================================
# Cấu hình SMTP cho EmailService
# Chỉnh sửa các thông số dưới đây cho phù hợp với môi trường
# ============================================================

# --- Server ---
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587

# --- Bảo mật ---
mail.smtp.auth=true
mail.smtp.starttls.enable=true

# --- Tài khoản gửi ---
# Địa chỉ hiển thị trong trường "From"
mail.from=your-email@gmail.com

# Tên đăng nhập Gmail (thường giống mail.from)
mail.username=your-email@gmail.com

# Với Gmail: dùng App Password (16 ký tự), KHÔNG dùng mật khẩu tài khoản.
# Tạo tại: https://myaccount.google.com/apppasswords
mail.password=xxxx-xxxx-xxxx-xxxx
